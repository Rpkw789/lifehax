# Render Blueprint — no credit card, no billing account, no spend risk.
#
# Render sets $PORT on each service (both Dockerfiles read it) and automatically
# exposes service env vars as Docker build args, which is what makes the
# frontend's build-time NEXT_PUBLIC_API_BASE work without a custom build config.
#
# Both services build from the REPO ROOT context (dockerContext: .) because
# backend/ and frontend/ both import shared/ via tsconfig path aliases
# (@contracts/*, @fixtures/* -> ../shared/*), which sits outside either package.
#
# Deploy: push this file, then New > Blueprint in the Render dashboard.
services:
  - type: web
    name: happy2-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # sync: false = Render prompts for the value and stores it encrypted;
      # nothing secret is committed to this repo.
      # Comma-separated, no spaces. Browserbase's free tier allows 3 concurrent
      # browsers PER ACCOUNT, so one key per teammate multiplies how many
      # agents can really browse. A single key is fine too.
      - key: BROWSERBASE_API_KEYS
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      # Direct OpenAI Responses API access for the three additional surface
      # simulations. Render stores this encrypted and never exposes it to the
      # frontend service.
      - key: OPENAI_API_KEY
        sync: false
      # The gateway's real name, not "default" — "default" only works if a
      # gateway is literally called that, and otherwise every model call fails
      # with a bare 401. Also note CLOUDFLARE_API_TOKEN must be an AI Gateway
      # token (permission: AI Gateway Run), not a general Cloudflare API token.
      - key: CLOUDFLARE_GATEWAY_ID
        value: zun-dev
      - key: HAPPY2_MODEL
        value: claude-sonnet-5
      - key: HAPPY2_OPENAI_MODEL
        value: gpt-5-mini
      # HAPPY2_REAL_AGENTS is deliberately unset: the backend defaults to 3 per
      # supplied key, so the population scales with however many keys are
      # configured instead of over-subscribing a single account.
      - key: HAPPY2_STAGE_DELAY_MS
        value: "0"

  - type: web
    name: happy2-frontend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    envVars:
      # Must be the backend's full https:// URL. Render has no string
      # concatenation in blueprints and onrender.com subdomains are globally
      # unique, so this cannot be derived — set it in the dashboard once the
      # backend is live, then redeploy this service. See docs/deploy.md.
      #
      # Keep this service free of secrets: Render turns every env var into a
      # build arg, and Next inlines NEXT_PUBLIC_* into the client bundle.
      - key: NEXT_PUBLIC_API_BASE
        sync: false
