# Render Blueprint — no credit card, no billing account, no spend risk.
#
# Render sets $PORT on each service (both Dockerfiles read it) and automatically
# exposes service env vars as Docker build args, which is what makes the
# frontend's build-time NEXT_PUBLIC_API_BASE work without a custom build config.
#
# Deploy: push this file, then New > Blueprint in the Render dashboard.
services:
  - type: web
    name: happy2-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      # sync: false = Render prompts for the value and stores it encrypted;
      # nothing secret is committed to this repo.
      - key: BROWSERBASE_API_KEY
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_GATEWAY_ID
        value: default
      - key: HAPPY2_MODEL
        value: claude-sonnet-5
      - key: HAPPY2_REAL_AGENTS
        value: "3"
      - key: HAPPY2_STAGE_DELAY_MS
        value: "0"

  - type: web
    name: happy2-frontend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      # Must be the backend's full https:// URL. Render has no string
      # concatenation in blueprints and onrender.com subdomains are globally
      # unique, so this cannot be derived — set it in the dashboard once the
      # backend is live, then redeploy this service. See docs/deploy.md.
      #
      # Keep this service free of secrets: Render turns every env var into a
      # build arg, and Next inlines NEXT_PUBLIC_* into the client bundle.
      - key: NEXT_PUBLIC_API_BASE
        sync: false
